<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 전시관</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><small>GROUP VIDEO PROJECT</small><h1>Climate Video Exhibition</h1></div><nav class="nav"><a href="index.html">영상 제출</a><a class="active" href="gallery.html">영상 전시관</a></nav></div></header><main class="page"><section class="hero"><div><div class="kicker">CLASS EXHIBITION</div><h2>우리 반 영상 전시관</h2><p>각 모둠이 제작한 영상을 감상하고 서로 다른 표현 방식과 메시지를 비교해 보세요.</p></div><div class="hero-note">전시 화면에는 모둠명, 영상, 작품명, 작품 설명만 표시됩니다. 모둠원 역할 정보는 제출 기록용으로만 저장됩니다.</div></section><div class="gallery-head"><div><div class="kicker">VIDEO WALL</div><h2>Exhibition</h2><p id="countText">작품을 불러오는 중입니다.</p></div><button id="refreshBtn" class="btn">새로고침</button></div><section id="gallery" class="gallery"><div class="empty">영상 작품을 불러오는 중입니다…</div></section></main><script src="config.js"></script><script>
const $=id=>document.getElementById(id);function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function renderVideos(items){if(!Array.isArray(items))items=[];$('countText').textContent=`총 ${items.length}편이 전시되어 있습니다.`;if(!items.length){$('gallery').innerHTML='<div class="empty">아직 전시된 영상이 없습니다.</div>';return}$('gallery').innerHTML=items.map(x=>`<article class="video-card"><div class="video-frame"><iframe src="https://drive.google.com/file/d/${encodeURIComponent(x.fileId)}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div><div class="video-info"><div class="group-badge">${esc(x.groupName)}</div><h3 class="video-title">${esc(x.title)}</h3><div class="video-desc">${esc(x.description)}</div></div></article>`).join('')}window.renderVideos=renderVideos;function loadVideos(){$('gallery').innerHTML='<div class="empty">영상 작품을 불러오는 중입니다…</div>';if(WEB_APP_URL.startsWith('PASTE_')){$('gallery').innerHTML='<div class="empty">전시관이 아직 서버와 연결되지 않았습니다.</div>';$('countText').textContent='';return}const old=document.getElementById('jsonpScript');if(old)old.remove();const s=document.createElement('script');s.id='jsonpScript';s.src=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action=list&callback=renderVideos&t='+Date.now();s.onerror=()=>{$('gallery').innerHTML='<div class="empty">영상 목록을 불러오지 못했습니다.</div>'};document.body.appendChild(s)}$('refreshBtn').onclick=loadVideos;loadVideos();
</script></body></html>
